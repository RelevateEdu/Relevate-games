<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Relevate Quick Quiz</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    h2 {
      margin-bottom: 16px;
    }
    .question {
      margin: 20px 0;
    }
    button {
      display: block;
      margin: 8px auto;
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #f43f5e;
      color: #fff;
      cursor: pointer;
      width: 80%;
      max-width: 300px;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #e11d48;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Quick Quiz</h2>
  <div id="quiz"></div>
  <div class="result" id="result"></div>

  <script>
    const questions = [
      {
        q: "What is the capital of France?",
        options: ["Berlin", "Madrid", "Paris", "Rome"],
        answer: 2
      },
      {
        q: "Which planet is known as the Red Planet?",
        options: ["Earth", "Mars", "Venus", "Jupiter"],
        answer: 1
      },
      {
        q: "In what year did World War II end?",
        options: ["1942", "1945", "1948", "1950"],
        answer: 1
      }
    ];

    let current = 0;
    let score = 0;

    function loadQuestion() {
      const quiz = document.getElementById("quiz");
      quiz.innerHTML = "";
      if (current < questions.length) {
        const q = questions[current];
        const qElem = document.createElement("div");
        qElem.className = "question";
        qElem.innerHTML = `<p>${q.q}</p>`;
        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.innerText = opt;
          btn.onclick = () => checkAnswer(i);
          qElem.appendChild(btn);
        });
        quiz.appendChild(qElem);
      } else {
        document.getElementById("result").innerText =
          `Quiz complete! You scored ${score} / ${questions.length}.`;
      }
    }

    function checkAnswer(i) {
      if (i === questions[current].answer) {
        score++;
      }
      current++;
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
