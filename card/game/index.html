<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Relevate • Flashcards</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .container{max-width:600px;padding:20px;text-align:center}
    h2{margin-bottom:20px}

    .card{
      position:relative;width:100%;min-height:220px;margin:0 auto 24px;
      perspective:1000px; -webkit-perspective:1000px; cursor:pointer;
      pointer-events:auto;
    }
    .inner{
      position:relative;width:100%;height:100%;text-align:center;
      transition:transform .6s; -webkit-transition:-webkit-transform .6s;
      transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
    }
    /* The class belongs on .card, not .inner */
    .card.flipped .inner{ transform:rotateY(180deg); -webkit-transform:rotateY(180deg); }

    .face{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      border-radius:12px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.35);
      backface-visibility:hidden; -webkit-backface-visibility:hidden;
      white-space:pre-line;
    }
    .front{background:#1f2937}
    .back{background:#374151; transform:rotateY(180deg); -webkit-transform:rotateY(180deg)}

    .nav{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
    button{padding:10px 16px;border:0;border-radius:8px;font-size:15px;cursor:pointer;background:#f43f5e;color:#fff}
    button:hover{background:#e11d48}
    .progress{margin-top:8px;font-size:14px;color:#9ca3af}
  </style>
</head>
<body>
  <div class="container">
    <h2>Enterprise & SMEs Flashcards</h2>

    <div class="card" id="card">
      <div class="inner" id="inner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>

    <div class="nav">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    const cards = [
      {q:"What is enterprise?",a:"The formation of a new business or development of a new good or service to be introduced to the market."},
      {q:"What does SME stand for?",a:"Small or Medium Enterprise."},
      {q:"How are small enterprises defined?",a:"Fewer than 50 employees and turnover less than €10m."},
      {q:"How are medium enterprises defined?",a:"Fewer than 250 employees and turnover less than €50m."},
      {q:"What proportion of the UK’s business population are SMEs?",a:"99.9%."},
      {q:"How many people do SMEs employ in the UK?",a:"Around 14.4 million people."},
      {q:"What is the difference between a need and a want?",a:"Needs = essentials for survival (food, shelter, water, clothing).\nWants = unlimited desires for a better quality of life (designer clothes, holidays, phones)."},
      {q:"How can satisfying needs and wants give opportunities to entrepreneurs?",a:"By spotting gaps in the market and creating businesses that provide goods/services people want or need."},
      {q:"List three ways entrepreneurs can identify business opportunities.",a:"• Gaps in the market.\n• Solving a problem.\n• Responding to changes in fashion, income, or population."},
      {q:"Give two examples of modern businesses that used new marketplaces to succeed.",a:"Amazon and eBay."},
      {q:"What is the role of the entrepreneur?",a:"To create, set up, run, and develop a business, providing goods and services customers want or need."},
      {q:"Give two financial motives for entrepreneurs.",a:"Profit and income."},
      {q:"Give two non-financial motives for entrepreneurs.",a:"Independence and personal satisfaction."},
      {q:"Name three characteristics/skills of entrepreneurs.",a:"Creativity, risk-taking, resilience."},
      {q:"What are the three sectors of the economy?",a:"Primary, Secondary, and Tertiary."},
      {q:"Give an example of a business in the primary sector.",a:"Farming, oil extraction, fishing."},
      {q:"Give an example of a business in the secondary sector.",a:"Manufacturing cars, making clothes, producing electronics."},
      {q:"Give an example of a business in the tertiary sector.",a:"Estate agents, delivery services, gyms."},
      {q:"Name three ways SMEs benefit the UK economy.",a:"Create jobs, pay taxes, introduce innovation."},
      {q:"Name two disadvantages of SMEs.",a:"Small budgets/less R&D and more likely to fail in a recession."}
    ];

    // Shuffle each run
    function shuffle(arr){ return arr.map(v=>({v,s:Math.random()})).sort((a,b)=>a.s-b.s).map(o=>o.v); }
    const deck = shuffle(cards);

    let i = 0;
    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const progress = document.getElementById('progress');

    function render(){
      front.textContent = deck[i].q;
      back.textContent = deck[i].a;
      card.classList.remove('flipped');
      progress.textContent = `Card ${i+1}/${deck.length}`;
    }

    // Flip on tap — set class on the CARD (not the inner)
    card.addEventListener('click', ()=> card.classList.toggle('flipped'));

    // Navigation
    document.getElementById('next').addEventListener('click', (e)=>{ e.stopPropagation(); if(i<deck.length-1){ i++; render(); } });
    document.getElementById('prev').addEventListener('click', (e)=>{ e.stopPropagation(); if(i>0){ i--; render(); } });

    render();
  </script>
</body>
</html>
